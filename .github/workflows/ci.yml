name: CI

on:
  push:
    branches:
      - main
      - feature/points-redemption-privacy
      - feature/admin-customer-points-modal
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run build
